<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#1b1842"/>
      <stop offset="100%" stop-color="#25215c"/>
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <!-- Top Hero Dark Navy Background -->
  <rect width="1440" height="900" fill="url(#heroGradient)" />

  <!-- Code Pattern Lines overlay (Subtle Code Aesthetic) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round">
    <line x1="80" y1="120" x2="320" y2="120" />
    <line x1="100" y1="150" x2="450" y2="150" />
    <line x1="120" y1="180" x2="280" y2="180" />
    <line x1="100" y1="210" x2="380" y2="210" />
    <line x1="80" y1="240" x2="220" y2="240" />
    
    <line x1="800" y1="140" x2="1200" y2="140" />
    <line x1="840" y1="170" x2="1100" y2="170" />
    <line x1="880" y1="200" x2="1250" y2="200" />
  </g>

  <!-- Purple/Lavender Accent Wave Band -->
  <path d="M 0,650 Q 360,780 720,670 T 1440,680 L 1440,900 L 0,900 Z" fill="url(#waveGradient)" opacity="0.85" />

  <!-- Pure White Bottom Section below the wave curve -->
  <path d="M 0,675 Q 360,805 720,695 T 1440,705 L 1440,900 L 0,900 Z" fill="#ffffff" />
</svg>
