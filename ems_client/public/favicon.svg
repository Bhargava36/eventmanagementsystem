<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Deep obsidian luxury background gradient -->
    <linearGradient id="ayojanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1017" />
      <stop offset="100%" stop-color="#020406" />
    </linearGradient>

    <!-- Vivid emerald brand gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Refined chamfered border stroke -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.08" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- High-contrast Squircle Base (visible across all light/dark/incognito browser themes) -->
  <rect width="64" height="64" rx="16" fill="url(#ayojanBg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Bold Modern Architectural 'A' Monogram for AYOJAN -->
  <path 
    d="M32 13L14 51H24L28.2 41.5H35.8L40 51H50L32 13ZM32 23.5L34.8 33.5H29.2L32 23.5Z" 
    fill="url(#emeraldGrad)" 
  />

  <!-- Official 4 Constellation Brand Nodes integrated into the primary vertices -->
  <!-- 1. Apex Summit Node -->
  <circle cx="32" cy="13" r="3" fill="#ffffff" filter="url(#subtleGlow)" />
  <!-- 2. Central Nexus Core (Crossbar) -->
  <circle cx="32" cy="37.5" r="2.2" fill="#ffffff" />
  <!-- 3. Left Foundation Node -->
  <circle cx="19" cy="51" r="2.2" fill="#34d399" />
  <!-- 4. Right Foundation Node -->
  <circle cx="45" cy="51" r="2.2" fill="#34d399" />
</svg>